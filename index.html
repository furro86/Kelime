<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kelimeler">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ayşe'nin Kelime Defteri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-column phone app, bottom tab bar on main screens, thumb-reach action bar in study screens */
:root{
  --bg:#F7F4EE; --card:#FFFFFF; --line:#E4DED3; --line2:#EEE8DE; --track:#E9E4DA;
  --ink:#1F2328; --ink2:#3A4047; --ink3:#5B6168; --mute:#8A8F95;
  --teal:#0F6E6E; --teal-d:#0B4F4F; --teal-l:#EFF6F5; --teal-l2:#E3F1EF; --on-teal:#FFFFFF;
  --star:#F2C14E; --star-ink:#6B4A00; --amber-l:#FFF6DE; --amber:#E0A100; --amber-d:#B07A00;
  --pic:#FFFFFF; --btn:#FFFFFF; --btn-line:#CFC8BB;
  --f:"Noto Sans","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fk:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141716; --card:#1E2221; --line:#2F3533; --line2:#2A302E; --track:#2C3230;
  --ink:#ECEEEC; --ink2:#C9CECC; --ink3:#A1A8A6; --mute:#7D8583;
  --teal:#3FA9A0; --teal-d:#8FD6CE; --teal-l:#1D2E2C; --teal-l2:#21403C; --on-teal:#0B1A19;
  --star:#F2C14E; --star-ink:#F2D27E; --amber-l:#2E2716; --amber:#C99212; --amber-d:#D9A93A;
  --pic:#F3EEE4; --btn:#232827; --btn-line:#3A413F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141716; --card:#1E2221; --line:#2F3533; --line2:#2A302E; --track:#2C3230;
  --ink:#ECEEEC; --ink2:#C9CECC; --ink3:#A1A8A6; --mute:#7D8583;
  --teal:#3FA9A0; --teal-d:#8FD6CE; --teal-l:#1D2E2C; --teal-l2:#21403C; --on-teal:#0B1A19;
  --star:#F2C14E; --star-ink:#F2D27E; --amber-l:#2E2716; --amber:#C99212; --amber-d:#D9A93A;
  --pic:#F3EEE4; --btn:#232827; --btn-line:#3A413F; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;-webkit-tap-highlight-color:transparent}
[lang="ko"]{font-family:var(--fk)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.scr{flex:1;display:flex;flex-direction:column;padding:0 16px}
.main{padding-bottom:96px}
h1{font-size:26px;font-weight:800;margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:700;color:var(--ink3);margin:0;letter-spacing:.04em;text-transform:uppercase}
.top{padding:20px 4px 12px;display:flex;flex-direction:column;gap:4px}
.sub{color:var(--ink3);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs>div{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:560px}
.tab{border:none;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700;color:var(--ink3);position:relative}
.tab[aria-current="page"]{color:var(--teal)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:var(--star);color:#3A2800;font-size:12px;line-height:20px;font-weight:800}
/* due banner */
.due{background:var(--teal);color:var(--on-teal);border-radius:24px;padding:20px;display:flex;align-items:center;gap:16px}
.due .n{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.due .t{flex:1;min-width:0;font-size:15px;font-weight:500;line-height:1.35}
.due button{border:none;border-radius:16px;background:var(--on-teal);color:var(--teal);min-height:52px;padding:0 20px;font-weight:800;font-size:16px}
.due.empty{background:var(--teal-l);color:var(--ink2)}
.due.empty .n{color:var(--teal)}
/* set list */
.setc{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;grid-template-columns:44px 1fr auto;gap:4px 12px;align-items:center}
.setc .no{grid-row:1/3;width:44px;height:44px;border-radius:14px;background:var(--teal-l);color:var(--teal);font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.setc.ort .no{background:var(--amber-l);color:var(--star-ink)}
.setc .ko{font-size:17px;font-weight:700;min-width:0}
.setc .tr{font-size:14px;color:var(--ink3);min-width:0}
.setc .meta{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--track);width:72px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:3px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--amber-l);color:var(--star-ink);border:1px solid var(--amber);vertical-align:2px;margin-left:6px}
.stars{display:inline-flex;align-items:center;gap:3px;color:var(--star-ink)}
/* header with back */
.hdr{display:flex;align-items:center;gap:8px;padding:12px 0 4px}
.icon-btn{width:48px;height:48px;border:none;background:none;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.progress{flex:1;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.progress i{display:block;height:100%;background:var(--teal);border-radius:4px;transition:width .25s}
.count{width:60px;text-align:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
/* modes */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{border:1px solid var(--line);background:var(--card);border-radius:20px;min-height:116px;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.mode b{font-size:17px}
.mode span{font-size:13px;color:var(--ink3);line-height:1.35}
.mode .mi{width:40px;height:40px;border-radius:12px;background:var(--teal-l);color:var(--teal);display:flex;align-items:center;justify-content:center}
.mode.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.mode.primary span{color:var(--on-teal);opacity:.85}
.mode.primary .mi{background:rgba(255,255,255,.18);color:var(--on-teal)}
/* word rows */
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-top:1px solid var(--line2)}
.row:first-child{border-top:none}
.row .pic{width:48px;height:48px;flex:none}
.row .w{flex:1;min-width:0;display:flex;flex-direction:column}
.row .w b{font-size:18px;font-weight:700}
.row .w span{font-size:14px;color:var(--ink3)}
.row .when{font-size:12px;font-weight:700;color:var(--ink3);margin-top:2px}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:10px;background:var(--teal-l2);color:var(--teal-d);margin-right:6px}
.chip.today{background:var(--star);color:#3A2800}
.spk{width:44px;height:44px;border:none;border-radius:22px;background:var(--teal-l);color:var(--teal);display:flex;align-items:center;justify-content:center;flex:none}
.starb{width:44px;height:44px;border:none;background:none;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--mute);flex:none}
.starb[aria-pressed="true"]{color:var(--star-ink)}
/* pictures */
.pic{background:var(--pic);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic svg{width:100%;height:100%;display:block}
.pic.text{font-size:13px;color:#5B6168;font-weight:700;text-align:center;padding:4px;box-sizing:border-box;line-height:1.2}
/* study card */
.study{flex:1;display:flex;flex-direction:column;padding:8px 0 0;min-height:0}
.card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px 22px;display:flex;flex-direction:column;gap:18px;min-height:380px}
.card.front{align-items:center;justify-content:center;text-align:center;cursor:pointer}
.card.front .pic{width:min(220px,60vw);height:min(220px,60vw);border-radius:24px}
.card.front .big{font-size:32px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.card.front .note{font-size:15px;color:var(--ink3)}
.hint{font-size:14px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.backhead{display:flex;align-items:center;gap:14px}
.backhead .pic{width:72px;height:72px;flex:none}
.backhead .w{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.backhead .ko{font-size:38px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.backhead .tr{font-size:16px;color:var(--ink2)}
.spk.big{width:52px;height:52px;border-radius:26px;background:var(--teal);color:var(--on-teal)}
.sec{border-top:1px solid var(--line2);padding-top:16px;display:flex;flex-direction:column;gap:4px}
.sec h3{font-size:12px;font-weight:700;color:var(--ink3);margin:0;letter-spacing:.08em}
.sec .k{font-size:20px;font-weight:700}
.sec .ex{font-size:19px;line-height:1.55}
.sec .ex b{font-weight:800;color:var(--teal)}
.sec .t{font-size:15px;color:var(--ink2);line-height:1.5}
.sec .exrow{display:flex;gap:8px;align-items:flex-start}
.sec .exrow>div{flex:1;min-width:0}
.actions{padding:12px 0 calc(24px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.actions.one{grid-template-columns:1fr}
.btn{min-height:60px;border-radius:16px;border:none;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.btn.teal{background:var(--teal);color:var(--on-teal)}
.btn.amber{background:var(--amber-l);border:2px solid var(--amber);color:var(--star-ink)}
.btn.ghost{background:var(--btn);border:1px solid var(--btn-line);color:var(--ink)}
.btn.small{min-height:48px;font-size:15px}
/* quiz */
.qhead{display:flex;align-items:center;gap:16px;padding:8px 0 0}
.qhead .pic{width:104px;height:104px;flex:none;border-radius:20px}
.qhead .w{display:flex;flex-direction:column;gap:4px;min-width:0}
.qhead .w span{font-size:14px;color:var(--ink3)}
.qhead .w b{font-size:28px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.opts{padding-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:68px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700;padding:8px;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.25;overflow-wrap:anywhere}
.opt.right{border:3px solid var(--teal);background:var(--teal-l2);color:var(--teal-d);font-weight:800}
.opt.wrong{border:2px dashed var(--amber-d);background:var(--amber-l);color:var(--star-ink)}
.opt.dim{color:var(--mute)}
.sheet{margin:auto -4px 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--card);border:1px solid var(--line);border-bottom:none;display:flex;flex-direction:column;gap:8px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .lab{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;color:var(--ink2)}
.sheet .ko{font-size:28px;font-weight:800;color:var(--teal-d)}
.sheet .ex{font-size:17px;line-height:1.5}
.sheet .ex b{font-weight:800}
.sheet .t{font-size:14px;color:var(--ink2)}
.added{font-size:13px;color:var(--star-ink);display:flex;align-items:center;gap:6px;margin-top:4px}
.sheet .btn{margin-top:8px}
.good{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:800;color:var(--teal);font-size:18px;padding:18px 0}
/* listen */
.lis{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0 6px}
.play{width:120px;height:120px;border:none;border-radius:60px;background:var(--teal);color:var(--on-teal);display:flex;align-items:center;justify-content:center}
.pill{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--btn-line);background:var(--btn);font-weight:700;font-size:14px}
.lgrid{padding:10px 0 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lopt{aspect-ratio:1/1;max-width:100%;border-radius:20px;border:1px solid var(--line);background:var(--pic);padding:10px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.lopt svg{width:100%;height:100%}
.lopt.text{background:var(--card);aspect-ratio:auto;min-height:92px;font-size:18px;font-weight:700;color:var(--ink)}
.lopt.right{border:4px solid var(--teal)}
.lopt.wrong{border:3px dashed var(--amber-d);opacity:.75}
.lopt.dim{opacity:.4}
/* end */
.endbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.endbox .big{font-size:26px;font-weight:800}
/* settings */
.opt-group{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.opt-group p{margin:0;font-size:14px;color:var(--ink3);line-height:1.5}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{min-height:52px;border-radius:14px;border:1px solid var(--btn-line);background:var(--btn);font-weight:700;font-size:14px;padding:6px 8px;line-height:1.3}
.seg button[aria-pressed="true"]{border:2px solid var(--teal);background:var(--teal-l2);color:var(--teal-d)}
.warn{color:var(--star-ink);background:var(--amber-l);border:1px solid var(--amber);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
.empty-note{background:var(--card);border:1px dashed var(--btn-line);border-radius:20px;padding:24px;text-align:center;color:var(--ink3);line-height:1.55;font-size:15px}
.legend{font-size:13px;color:var(--ink3);line-height:1.5}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<script>
(function(){
"use strict";
var SETS = JSON.parse(document.getElementById('sets-data').textContent);
var ICONS = JSON.parse(document.getElementById('icons-data').textContent);
var INT = [1,3,7];
var KEY = 'ayse-kelime-v1';
var app = document.getElementById('app');

// ---------- word index ----------
var WORDS = {}; // key -> {w, set}
SETS.forEach(function(s){ s.words.forEach(function(w,i){ var k=s.set+':'+i; w._k=k; w._set=s; WORDS[k]=w; }); });

// ---------- state ----------
var S = {known:{}, stars:{}, opt:{dir:'pic', auto:true, rate:'normal'}};
function load(){ try{ var raw=localStorage.getItem(KEY); if(raw){ var d=JSON.parse(raw); S.known=d.known||{}; S.stars=d.stars||{}; if(d.opt){ for(var o in d.opt) S.opt[o]=d.opt[o]; } } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
load();
function today(){ var d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000); }
function star(k){ S.stars[k]={lvl:0, due:today()+INT[0]}; delete S.known[k]; save(); }
function unstar(k){ delete S.stars[k]; save(); }
function isStar(k){ return !!S.stars[k]; }
function dueKeys(){ var t=today(); return Object.keys(S.stars).filter(function(k){ return WORDS[k] && S.stars[k].due<=t; }); }
function starKeys(){ return Object.keys(S.stars).filter(function(k){ return WORDS[k]; }); }
// review pass: advance interval; passing at 7-day level removes the star
function reviewPass(k){ var st=S.stars[k]; if(!st) return 'none'; if(st.due>today()) return 'early';
  if(st.lvl>=2){ delete S.stars[k]; S.known[k]=true; save(); return 'done'; }
  st.lvl++; st.due=today()+INT[st.lvl]; save(); return 'up'; }
function knownCount(s){ var n=0; s.words.forEach(function(w){ if(S.known[w._k]) n++; }); return n; }
function starCount(s){ var n=0; s.words.forEach(function(w){ if(S.stars[w._k]) n++; }); return n; }

// ---------- speech ----------
var koVoice=null, hasSpeech=('speechSynthesis' in window);
function pickVoice(){ if(!hasSpeech) return; try{ var vs=speechSynthesis.getVoices(); koVoice=vs.filter(function(v){return /^ko/i.test(v.lang);})[0]||null; }catch(e){} }
if(hasSpeech){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function say(text, slow){ if(!hasSpeech||!text) return; try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text.replace(/^[A-Z]:\s*/,'').replace(/\s\/\s[A-Z]:\s*/g,'. ')); u.lang='ko-KR'; if(koVoice) u.voice=koVoice; u.rate = slow?0.55:(S.opt.rate==='slow'?0.7:0.9); speechSynthesis.speak(u); }catch(e){} }

// ---------- helpers ----------
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function exHtml(w){ var ex=esc(w.ex), hl=esc(w.hl||''); if(hl){ var i=ex.indexOf(hl); if(i>=0) return ex.slice(0,i)+'<b>'+hl+'</b>'+ex.slice(i+hl.length); } return ex; }
function trFull(w){ return w.tr + (w.trNote? ' '+w.trNote:''); }
function pic(w, cls){ var svg=w.icon && ICONS[w.icon]; if(svg) return '<div class="pic '+(cls||'')+'" role="img" aria-label="'+esc(w.tr)+'">'+svg+'</div>'; return ''; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function isOrt(s){ return /^ORT/.test(s.set); }

};
function spkBtn(text, cls, label){ return '<button class="spk '+(cls||'')+'" data-say="'+esc(text)+'" aria-label="'+esc(label||'Dinle')+'">'+(cls==='big'?I.spkBig.replace(/56/g,'24'):I.spk)+'</button>'; }
function starBtn(k){ var on=isStar(k); return '<button class="starb" data-star="'+k+'" aria-pressed="'+on+'" aria-label="'+(on?'Yıldızı kaldır':'Yıldız ekle')+'">'+(on?I.starOn:I.starOff)+'</button>'; }
function dueText(k){ var st=S.stars[k]; if(!st) return ''; var d=st.due-today();
  var chip='<span class="chip'+(d<=0?' today':'')+'">'+INT[st.lvl]+' gün</span>';
  return chip+(d<=0?'bugün':(d===1?'yarın':d+' gün sonra')); }

// ---------- global click delegation ----------
app.addEventListener('click', function(e){
  var b=e.target.closest('[data-say]'); if(b){ e.stopPropagation(); say(b.getAttribute('data-say'), b.hasAttribute('data-slow')); return; }
  var s=e.target.closest('[data-star]'); if(s){ e.stopPropagation(); var k=s.getAttribute('data-star'); if(isStar(k)) unstar(k); else star(k); render(); return; }
  var a=e.target.closest('[data-act]'); if(a){ var fn=ACT[a.getAttribute('data-act')]; if(fn) fn(a.getAttribute('data-arg'), a); }
});

// ---------- navigation ----------
var V = {tab:'sets', screen:null}; // screen: {type:'set', set} | session
var ACT = {
  tab:function(t){ V.tab=t; V.screen=null; V.confirm=false; render(); scrollTop(); },
  openSet:function(id){ V.screen={type:'set', set:SETS.filter(function(s){return s.set===id;})[0]}; render(); scrollTop(); },
  back:function(){ if(hasSpeech) try{speechSynthesis.cancel();}catch(e){} if(V.screen && V.screen.from) { V.screen=V.screen.from; } else V.screen=null; render(); scrollTop(); },
  cards:function(){ startCards(V.screen.set.words, {from:V.screen, title:V.screen.set.title}); },
  quiz:function(){ startQuiz(V.screen.set, V.screen); },
  listen:function(){ startListen(V.screen.set, V.screen); },
  showList:function(){ V.screen.showList=!V.screen.showList; render(); },
  review:function(){ var ks=dueKeys(); if(!ks.length) return; startCards(shuffle(ks).map(function(k){return WORDS[k];}), {from:V.screen, review:true, title:'Bugünkü tekrar'}); },
  reviewAll:function(){ var ks=starKeys(); if(!ks.length) return; startCards(shuffle(ks).map(function(k){return WORDS[k];}), {from:V.screen, review:true, title:'Bilmediklerim'}); },
  flip:function(){ var c=V.screen; if(c.flipped) return; c.flipped=true; render(); if(S.opt.auto) say(c.list[c.i].ko); },
  know:function(){ answerCard(true); }, dunno:function(){ answerCard(false); },
  pick:function(arg){ pickOption(+arg); },
  next:function(){ nextQ(); },
  replay:function(){ var c=V.screen; say(c.qs[c.i].w.ko); },
  replaySlow:function(){ var c=V.screen; say(c.qs[c.i].w.ko, true); },
  again:function(){ var c=V.screen; if(c.type==='cards') startCards(c.orig, {from:c.from, review:c.review, title:c.title}); else if(c.type==='quiz') startQuiz(c.set, c.from); else startListen(c.set, c.from); },
  optDir:function(v){ S.opt.dir=v; save(); render(); },
  optAuto:function(v){ S.opt.auto=(v==='on'); save(); render(); },
  optRate:function(v){ S.opt.rate=v; save(); render(); say('안녕하세요. 만나서 반가워요.'); },
  testVoice:function(){ say('안녕하세요. 만나서 반가워요.'); },
  askReset:function(){ V.confirm=true; render(); },
  cancelReset:function(){ V.confirm=false; render(); },
  doReset:function(){ S.known={}; S.stars={}; save(); V.confirm=false; V.resetDone=true; render(); }
};
function scrollTop(){ try{ window.scrollTo(0,0); }catch(e){} }

// ---------- sessions ----------
function startCards(list, o){ V.screen={type:'cards', orig:list, list:list, i:0, flipped:false, from:o.from, review:!!o.review, title:o.title, res:{k:0,u:[]}}; render(); scrollTop();
  if(S.opt.dir==='ko' && S.opt.auto) say(list[0].ko); }
function answerCard(ok){ var c=V.screen, w=c.list[c.i];
  if(ok){ c.res.k++; if(c.review){ reviewPass(w._k); } else { S.known[w._k]=true; if(isStar(w._k)) reviewPass(w._k); save(); } }
  else { star(w._k); c.res.u.push(w); }
  c.i++; c.flipped=false; render(); scrollTop();
  if(c.i<c.list.length && S.opt.dir==='ko' && S.opt.auto) say(c.list[c.i].ko); }
function makeQs(set){ var ws=set.words; return shuffle(ws).map(function(w){ var others=shuffle(ws.filter(function(x){return x!==w && x.ko!==w.ko;})).slice(0,3); return {w:w, opts:shuffle([w].concat(others)), picked:-1}; }); }
function startQuiz(set, from){ V.screen={type:'quiz', set:set, from:from, qs:makeQs(set), i:0, wrong:[]}; render(); scrollTop(); }
function startListen(set, from){ V.screen={type:'listen', set:set, from:from, qs:makeQs(set), i:0, wrong:[], text:set.words.some(function(w){return !w.icon || !ICONS[w.icon];})}; render(); scrollTop(); say(V.screen.qs[0].w.ko); }
var advTimer=null;
function pickOption(n){ var c=V.screen, q=c.qs[c.i]; if(q.picked>=0) return; q.picked=n; var ok=q.opts[n]===q.w;
  if(ok){ S.known[q.w._k]=true; if(isStar(q.w._k)) reviewPass(q.w._k); save(); if(c.type==='quiz') say(q.w.ko); render(); clearTimeout(advTimer); advTimer=setTimeout(function(){ if(V.screen===c && c.qs[c.i]===q) nextQ(); }, 1100); }
  else { star(q.w._k); c.wrong.push(q.w); render(); say(q.w.ko); } }
function nextQ(){ clearTimeout(advTimer); var c=V.screen; c.i++; render(); scrollTop(); if(c.type==='listen' && c.i<c.qs.length) say(c.qs[c.i].w.ko); }

// ---------- views ----------
function tabbar(){ var n=dueKeys().length;
  function t(id,label,ic,badge){ return '<button class="tab" data-act="tab" data-arg="'+id+'"'+(V.tab===id?' aria-current="page"':'')+'>'+ic+'<span>'+label+'</span>'+(badge?'<span class="badge">'+badge+'</span>':'')+'</button>'; }
  return '<nav class="tabs" aria-label="Ana menü"><div>'+t('sets','Setler',I.tSets)+t('unknown','Bilmediklerim',I.tStar,n||'')+t('settings','Ayarlar',I.tSet)+'</div></nav>'; }

function dueBanner(){ var n=dueKeys().length;
  if(n) return '<div class="due"><span class="n">'+n+'</span><span class="t">kelime bugün tekrar bekliyor</span><button data-act="review">Başla</button></div>';
  var all=starKeys().length;
  return '<div class="due empty"><span class="n">0</span><span class="t">'+(all?'Bugün tekrar yok. Yıldızlı '+all+' kelime sırasını bekliyor.':'Bugün tekrar yok. Bir set seç ve başla.')+'</span></div>'; }

function viewSets(){ var h='<div class="scr main"><div class="top"><h1>Kelime Defterim</h1><span class="sub" lang="ko">아이셰의 단어장 · 32 set · 640 kelime</span></div><div class="stack">'+dueBanner();
  SETS.forEach(function(s){ var k=knownCount(s), st=starCount(s);
    h+='<button class="setc'+(isOrt(s)?' ort':'')+'" data-act="openSet" data-arg="'+s.set+'"><span class="no">'+s.order+'</span><span class="ko" lang="ko">'+esc(s.title)+'</span><span class="meta"><span>'+(st?'<span class="stars">'+I.starSm+st+'</span> · ':'')+k+'/20</span><span class="bar"><i style="width:'+(k*5)+'%"></i></span></span><span class="tr">'+esc(s.titleTr)+(isOrt(s)?'<span class="tag">ORTAK</span>':'')+'</span></button>'; });
  return h+'</div></div>'+tabbar(); }

function wordRow(w, withDue){ return '<div class="row">'+(pic(w)||'<div class="pic text" aria-hidden="true">Aa</div>')+'<div class="w"><b lang="ko">'+esc(w.ko)+'</b><span>'+esc(trFull(w))+'</span>'+(withDue?'<span class="when">'+dueText(w._k)+'</span>':'')+'</div>'+spkBtn(w.ko)+starBtn(w._k)+'</div>'; }

function viewSet(){ var s=V.screen.set, k=knownCount(s), st=starCount(s);
  var h='<div class="scr"><div class="hdr"><button class="icon-btn" data-act="back" aria-label="Geri">'+I.back+'</button><span class="sub">'+(isOrt(s)?'ORTAK · ':'')+'Set '+s.order+'</span></div>'+
  '<div class="top" style="padding-top:4px"><h1 lang="ko">'+esc(s.title)+'</h1><span class="sub">'+esc(s.titleTr)+'</span><span class="sub" style="font-size:14px;display:flex;align-items:center;gap:10px;margin-top:6px"><span class="bar" style="width:120px"><i style="width:'+(k*5)+'%"></i></span>'+k+'/20 biliyorum'+(st?' · <span class="stars">'+I.starSm+st+'</span>':'')+'</span></div>'+
  '<div class="modes">'+
   '<button class="mode primary" data-act="cards"><span class="mi">'+I.cards+'</span><b>Kartlar</b><span>Resme bak, Korecesini hatırla</span></button>'+
   '<button class="mode" data-act="quiz"><span class="mi">'+I.quiz+'</span><b>Test</b><span>4 seçenekten doğruyu bul</span></button>'+
   '<button class="mode" data-act="listen"><span class="mi">'+I.ear+'</span><b>Dinle ve seç</b><span>'+(s.words.some(function(w){return !w.icon;})?'Dinle, anlamını seç':'Dinle, resmini seç')+'</span></button>'+
   '<button class="mode" data-act="showList" aria-expanded="'+!!V.screen.showList+'"><span class="mi">'+I.list+'</span><b>Kelime listesi</b><span>'+(V.screen.showList?'Listeyi gizle':'20 kelimenin hepsi')+'</span></button>'+
  '</div>';
  if(V.screen.showList){ h+='<div class="list" style="margin:16px 0 32px">'+s.words.map(function(w){return wordRow(w);}).join('')+'</div>'; }
  else h+='<div style="height:32px"></div>';

function sessHdr(i,n){ return '<div class="hdr"><button class="icon-btn" data-act="back" aria-label="Kapat">'+I.x+'</button><div class="progress"><i style="width:'+Math.round(i/n*100)+'%"></i></div><span class="count">'+Math.min(i+1,n)+' / '+n+'</span></div>'; }

function backFace(w){ return '<div class="card"><div class="backhead">'+(pic(w)||'')+'<div class="w"><span class="ko" lang="ko">'+esc(w.ko)+'</span><span class="tr">'+esc(trFull(w))+'</span></div>'+spkBtn(w.ko,'big')+'</div>'+
  (w.pair?'<div class="sec"><h3>KALIP</h3><span class="k" lang="ko">'+esc(w.pair)+'</span><span class="t">'+esc(w.pairTr)+'</span></div>':'')+
  '<div class="sec"><h3>ÖRNEK</h3><div class="exrow"><div><div class="ex" lang="ko">'+exHtml(w)+'</div><div class="t">'+esc(w.exTr)+'</div></div>'+spkBtn(w.ex,'','Örneği dinle')+'</div></div></div>'; }

function viewCards(){ var c=V.screen, n=c.list.length;
  if(c.i>=n) return endCards();
  var w=c.list[c.i], h='<div class="scr">'+sessHdr(c.i,n)+'<div class="study">';
  if(c.review && S.stars[w._k]) h+='<div class="legend" style="padding:0 4px 8px">'+dueText(w._k)+'</div>';
  if(!c.flipped){
    if(S.opt.dir==='ko') h+='<div class="card front" data-act="flip" role="button" tabindex="0" aria-label="Kartı çevir"><span class="big" lang="ko" style="font-size:44px">'+esc(w.ko)+'</span>'+spkBtn(w.ko,'big')+'<span class="hint">'+I.flip+'Dokun, anlamını gör</span></div>';
    else h+='<div class="card front" data-act="flip" role="button" tabindex="0" aria-label="Kartı çevir">'+(pic(w)||'')+'<span class="big">'+esc(w.tr)+'</span>'+(w.trNote?'<span class="note">'+esc(w.trNote)+'</span>':'')+'<span class="hint">'+I.flip+'Korecesini düşün, sonra dokun</span></div>';
    h+='</div><div class="actions one"><button class="btn teal" data-act="flip">'+I.flip+'Çevir</button></div>';
  } else {
    h+=backFace(w)+'</div><div class="actions"><button class="btn amber" data-act="dunno">'+I.starOn.replace('width="24" height="24"','width="22" height="22"')+'Bilmiyorum</button><button class="btn teal" data-act="know">'+I.check+'Biliyorum</button></div>';
  }
  return h+'</div>'; }

function endList(ws, title){ if(!ws.length) return ''; return '<h2 style="margin:20px 4px 10px">'+title+'</h2><div class="list">'+ws.map(function(w){return wordRow(w);}).join('')+'</div>'; }
function endCards(){ var c=V.screen, u=c.res.u;
  var msg = u.length? u.length+' kelime Bilmediklerim listesine eklendi. Yarın tekrar karşına çıkacak.' : 'Hepsini bildin. Harika!';
  return '<div class="scr"><div class="hdr"><button class="icon-btn" data-act="back" aria-label="Kapat">'+I.x+'</button></div><div class="endbox"><span class="big">Bitti!</span><span class="sub">'+c.list.length+' kart · '+c.res.k+' biliyorum</span><span class="sub">'+msg+'</span></div>'+
    endList(u,'Bilmediklerin')+'<div class="actions"><button class="btn ghost" data-act="again">Tekrar</button><button class="btn teal" data-act="back">'+(c.review?'Listeye dön':'Sete dön')+'</button></div></div>'; }

function endQuiz(){ var c=V.screen, u=c.wrong;
  var msg = u.length? 'Karıştırdığın '+u.length+' kelime Bilmediklerim listesine eklendi.' : 'Hiç karıştırmadın. Harika!';
  return '<div class="scr"><div class="hdr"><button class="icon-btn" data-act="back" aria-label="Kapat">'+I.x+'</button></div><div class="endbox"><span class="big">Bitti!</span><span class="sub">'+msg+'</span></div>'+
    endList(u,'Karıştırdıkların')+'<div class="actions"><button class="btn ghost" data-act="again">Tekrar</button><button class="btn teal" data-act="back">Sete dön</button></div></div>'; }

function answerSheet(w){ return '<div class="sheet" role="status"><div class="lab"><span>Doğrusu bu:</span>'+spkBtn(w.ko)+'</div><div style="display:flex;align-items:center;gap:12px">'+(pic(w)?pic(w).replace('class="pic ','class="pic " style="width:56px;height:56px;flex:none"'):'')+'<div style="display:flex;flex-direction:column;min-width:0"><span class="ko" lang="ko">'+esc(w.ko)+'</span><span class="t">'+esc(trFull(w))+'</span></div></div><span class="ex" lang="ko">'+exHtml(w)+'</span><span class="t">'+esc(w.exTr)+'</span><span class="added">'+I.starSm+'Bilmediklerim listesine eklendi</span><button class="btn teal" data-act="next">Devam</button></div>'; }

function viewQuiz(){ var c=V.screen, n=c.qs.length; if(c.i>=n) return endQuiz();
  var q=c.qs[c.i], w=q.w, done=q.picked>=0, ok=done && q.opts[q.picked]===w;
  var h='<div class="scr">'+sessHdr(c.i,n)+'<div class="qhead">'+(pic(w)||'')+'<div class="w"><span>Korecesi hangisi?</span><b>'+esc(trFull(w))+'</b></div></div><div class="opts">';
  q.opts.forEach(function(o,j){ var cls='opt'; if(done){ if(o===w) cls+=' right'; else if(j===q.picked) cls+=' wrong'; else cls+=' dim'; }
    h+='<button class="'+cls+'" lang="ko" data-act="pick" data-arg="'+j+'"'+(done?' aria-disabled="true"':'')+'>'+(done&&o===w?I.check:'')+esc(o.ko)+'</button>'; });
  h+='</div>';
  if(done && ok) h+='<div class="good" role="status">'+I.check+'Doğru!</div>';
  if(done && !ok) h+=answerSheet(w);
  return h+'</div>'; }

function viewListen(){ var c=V.screen, n=c.qs.length; if(c.i>=n) return endQuiz();
  var q=c.qs[c.i], w=q.w, done=q.picked>=0, ok=done && q.opts[q.picked]===w;
  var h='<div class="scr">'+sessHdr(c.i,n)+'<div class="lis"><button class="play" data-act="replay" aria-label="Tekrar dinle">'+I.spkBig+'</button><div style="display:flex;gap:10px"><button class="pill" data-act="replay">Tekrar</button><button class="pill" data-act="replaySlow">Yavaş dinle</button></div><span style="font-weight:700">'+(c.text?'Duyduğun kelimenin anlamını seç':'Duyduğun kelimenin resmini seç')+'</span></div><div class="lgrid">';
  q.opts.forEach(function(o,j){ var cls='lopt'+(c.text?' text':''); if(done){ if(o===w) cls+=' right'; else if(j===q.picked) cls+=' wrong'; else cls+=' dim'; }
    h+='<button class="'+cls+'" data-act="pick" data-arg="'+j+'" aria-label="'+(c.text?esc(o.tr):'Seçenek '+(j+1))+'">'+(c.text?esc(trFull(o)):ICONS[o.icon])+'</button>'; });
  h+='</div>';
  if(done && ok) h+='<div class="good" role="status" style="padding-top:0">'+I.check+'Doğru! <span lang="ko">'+esc(w.ko)+'</span></div>';
  if(done && !ok) h+=answerSheet(w);
  return h+'</div>'; }

function viewUnknown(){ var due=dueKeys(), all=starKeys();
  var h='<div class="scr main"><div class="top"><h1>Bilmediklerim</h1><span class="sub">Yıldızlı kelimeler 1 gün, 3 gün, 7 gün sonra tekrar gelir. 7 gün sonra da bilirsen yıldız kendiliğinden kalkar.</span></div><div class="stack">';
  if(!all.length) return h+'<div class="empty-note">Henüz yıldızlı kelime yok.<br>Kartlarda <b>Bilmiyorum</b> dediğin ya da testte karıştırdığın kelimeler burada toplanır.</div></div></div>'+tabbar();
  h+=dueBanner();
  if(due.length){ h+='<h2 style="margin:8px 4px 0">Bugün bakılacak · '+due.length+'</h2><div class="list">'+due.map(function(k){return wordRow(WORDS[k],true);}).join('')+'</div>'; }
  var rest=all.filter(function(k){return due.indexOf(k)<0;}).sort(function(a,b){return S.stars[a].due-S.stars[b].due;});
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin:8px 4px 0;gap:12px"><h2>Hepsi · '+all.length+'</h2><button class="pill" data-act="reviewAll">Hepsini çalış</button></div>';
  if(rest.length) h+='<div class="list">'+rest.map(function(k){return wordRow(WORDS[k],true);}).join('')+'</div>';
  else h+='<p class="legend" style="margin:0 4px">Hepsi yukarıda, bugünkü listede.</p>';
  h+='<p class="legend" style="margin:4px 4px 0">Yıldıza dokunursan kelime listeden çıkar.</p>';
  return h+'</div></div>'+tabbar(); }

function seg(act, cur, a, b){ return '<div class="seg"><button data-act="'+act+'" data-arg="'+a[0]+'" aria-pressed="'+(cur===a[0])+'">'+a[1]+'</button><button data-act="'+act+'" data-arg="'+b[0]+'" aria-pressed="'+(cur===b[0])+'">'+b[1]+'</button></div>'; }
function viewSettings(){ var known=Object.keys(S.known).length, stars=starKeys().length;
  var h='<div class="scr main"><div class="top"><h1>Ayarlar</h1></div><div class="stack">'+
  '<div class="opt-group"><h2>Kartın ön yüzü</h2>'+seg('optDir',S.opt.dir,['pic','Resim + Türkçe'],['ko','Korece'])+'<p>'+(S.opt.dir==='pic'?'Resme ve Türkçe anlama bakıp Korece kelimeyi hatırlarsın.':'Korece kelimeyi görüp anlamını hatırlarsın.')+'</p></div>'+
  '<div class="opt-group"><h2>Otomatik seslendirme</h2>'+seg('optAuto',S.opt.auto?'on':'off',['on','Açık'],['off','Kapalı'])+'<p>Kart çevrilince Korece kelime kendiliğinden okunur.</p></div>'+
  '<div class="opt-group"><h2>Ses hızı</h2>'+seg('optRate',S.opt.rate,['normal','Normal'],['slow','Yavaş'])+'<button class="btn ghost small" data-act="testVoice">'+I.spk+'Sesi dene</button>'+
   (!hasSpeech?'<div class="warn">Bu tarayıcı sesli okuma desteklemiyor. Chrome ya da Safari ile aç.</div>':(!koVoice?'<div class="warn">Telefonda Korece ses bulunamadı. Ses gelmezse: Ayarlar → Dil / Metin okuma bölümünden Korece sesi indir.</div>':''))+'</div>'+
  '<div class="opt-group"><h2>İlerleme</h2><p>Bildiğin kelime: <b>'+known+'</b> · Yıldızlı: <b>'+stars+'</b><br>İlerleme bu telefonda, bu tarayıcıda saklanır. Tarayıcı verilerini silersen ilerleme de silinir.</p>'+
   (V.resetDone?'<div class="warn">İlerleme sıfırlandı.</div>':'')+
   (V.confirm?'<div class="warn">Bütün ilerleme ve yıldızlar silinecek. Emin misin?</div><div class="seg"><button data-act="cancelReset">Vazgeç</button><button data-act="doReset" style="border:2px solid var(--amber-d);color:var(--star-ink)">Evet, sıfırla</button></div>':'<button class="btn ghost small" data-act="askReset">İlerlemeyi sıfırla</button>')+'</div>'+
  '<div class="opt-group"><h2>İpucu</h2><p>Bu sayfayı tarayıcı menüsünden <b>Ana ekrana ekle</b> ile telefonuna ekleyebilirsin. Böylece uygulama gibi açılır.</p></div>'+
  '</div></div>'+tabbar();
  V.resetDone=false; return h; }

function render(){ var s=V.screen, h;
  if(s && s.type==='set') h=viewSet();
  else if(s && s.type==='cards') h=viewCards();
  else if(s && s.type==='quiz') h=viewQuiz();
  else if(s && s.type==='listen') h=viewListen();
  else if(V.tab==='unknown') h=viewUnknown();
  else if(V.tab==='settings') h=viewSettings();
  else h=viewSets();
  app.innerHTML=h; }

app.addEventListener('keydown', function(e){ if((e.key==='Enter'||e.key===' ') && e.target.matches('.card.front')){ e.preventDefault(); ACT.flip(); } });
render();
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
